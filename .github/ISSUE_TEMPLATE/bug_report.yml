name: Báo lỗi / Bug Report
description: Báo lỗi ổ đĩa NTFS/USB/SSD, NidoDrop LAN, Capture Studio hoặc NidoArchive trên macOS & Windows
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Phân hệ gặp sự cố / Affected Module
      options:
        - Nhận diện & Đọc/Ghi ổ đĩa macOS (NTFS / USB Flash / SD Card / SSD / HDD)
        - Truyền tệp & Clipboard nội bộ (NidoDrop LAN / QR / PIN)
        - Chụp màn hình, Ghi chú, OCR & Quay video (Capture Studio / Quick Record)
        - Giải nén, Đóng gói & Chuyển đổi ảnh/media (NidoArchive / NidoImage)
        - Cập nhật tự động / Tự khởi động cùng hệ thống (macOS & Windows)
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Phiên bản NidoBox, Hệ điều hành & Thiết bị / Environment & Hardware
      placeholder: "VD: NidoBox v1.4.0 • macOS 15.4 (arm64) hoặc Windows 11 24H2 (x64)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Mô tả chi tiết / What happened?
      placeholder: "Mô tả các bước thực hiện, kết quả mong đợi và lỗi thực tế gặp phải..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Thông số chẩn đoán / Diagnostic Report (Optional)
      description: "Dán nội dung từ nút 'Góp ý -> Sao chép báo cáo' trong ứng dụng NidoBox (macOS / Windows)"
