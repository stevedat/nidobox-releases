name: Đề xuất tính năng / Feature Request
description: Đề xuất thêm tính năng mới hoặc cải tiến trải nghiệm NidoNTFS
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Nhu cầu sử dụng / Problem or Use Case
      description: "Bạn đang cần thực hiện thao tác gì với ổ cứng ngoài, USB hoặc truyền tệp?"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Đề xuất giải pháp / Proposed Solution
      description: "Bạn mong muốn tính năng đó hoạt động như thế nào trong NidoNTFS?"
    validations:
      required: true
